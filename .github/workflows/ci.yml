name: BohemiX CI

on:
  push:
    branches: [ main, master, "codex/**" ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BohemiX.sln
      - name: Release build
        run: dotnet build BohemiX.sln -c Release --no-restore --nologo
      - name: Release tests
        run: dotnet test BohemiX.sln -c Release --no-build --no-restore --nologo
